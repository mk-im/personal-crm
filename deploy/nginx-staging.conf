# Test stand only. Do not include the landing or the production app site.
server {
  listen 80;
  listen [::]:80;
  server_name test-app.crmc.space;

  location /.well-known/acme-challenge/ {
    root /var/www/html;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name test-app.crmc.space;

  ssl_certificate /etc/letsencrypt/live/test-app.crmc.space/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/test-app.crmc.space/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  auth_basic "Тестовый стенд";
  auth_basic_user_file /etc/nginx/personal-crm-staging.htpasswd;

  client_max_body_size 1m;

  location / {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;
  }
}
